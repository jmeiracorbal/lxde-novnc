services:
  desktop:
    build:
      context: ./build
      dockerfile: Dockerfile
    container_name: lxde-novnc
    ports:
      - "6080:6080"
      - "5900:5900"
    environment:
      - SYSTEM_USER=ubuntu
      - VNC_PASS=letmein
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped